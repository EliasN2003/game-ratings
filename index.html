<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game ratings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Lora:ital,wght@1,400;1,500;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f13'/%3E%3Cpath d='M16 6l3 7.5 8 .7-6.1 5.3L22.8 27 16 22.6 9.2 27l1.9-7.5L5 14.2l8-.7z' fill='%23f3c969'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#0d0f13; --bg-raise:#15181e; --text:#ece8e0; --text-dim:#8d9098;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-snap-type:y proximity; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{background:var(--bg); color:var(--text); font-family:'Work Sans', sans-serif; overflow-x:hidden;}
  .tier-display{font-family:'Fraunces', serif;}

  /* Scrollbar removal */
  html{scrollbar-width:none; overflow-anchor:none;}
  html::-webkit-scrollbar{display:none;}

  nav.dots{position:fixed; right:1.4rem; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:.75rem; z-index:50;}
  nav.dots button{width:16px; height:16px; border-radius:50%; border:1px solid var(--text-dim); background:transparent; cursor:pointer; padding:0; opacity:.5; transition:opacity .25s, transform .25s;}
  nav.dots button.active{opacity:1; transform:scale(1.2);}
  nav.dots button{display:flex; align-items:center; justify-content:center; font:500 11px/1 'Work Sans', sans-serif; letter-spacing:-.02em; color:var(--text-dim);}
  nav.dots button.active{color:var(--text);}

  section.tier{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden; padding:4rem 6vw; scroll-snap-align:start; border-bottom:1px solid rgba(255,255,255,.05);}
  .ghost-num{position:absolute; right:-2vw; top:50%; transform:translateY(-50%); font-size:min(60vw, 46rem); line-height:1; font-weight:500; color:var(--tc); opacity:.07; pointer-events:none; user-select:none; letter-spacing:-.04em;}
  .tier-head{max-width:780px; position:relative; z-index:2;}
  .tier-num{font-size:clamp(2.2rem, 5vw, 3.6rem); color:var(--tc); line-height:1.05; display:inline-block; margin-bottom:.6rem;}
  .tier-title{font-family:'Lora', serif; font-style:italic; font-size:clamp(1rem, 1.6vw, 1.25rem); font-weight:500; color:var(--text-dim); opacity:.92; margin-bottom:.9rem; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
  .tier-desc{color:var(--text-dim); font-size:1.02rem; line-height:1.6; max-width:60ch;}

  /* ---------- Landing ---------- */
  section.landing{background:radial-gradient(ellipse 70% 60% at 15% 50%, rgba(243,201,105,.17), transparent 70%);}
  .landing-head{max-width:900px; position:relative; z-index:2;}
  .landing-phrase{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(2.6rem, 7vw, 5.2rem); line-height:1.05; letter-spacing:-.01em; color:var(--text); margin-bottom:.9rem;}
  .landing-sub{font-family:'Lora', serif; font-style:italic; font-weight:500; font-size:clamp(1.15rem, 2.4vw, 1.7rem); color:var(--text-dim); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
  .landing-strip{display:flex; gap:3px; width:min(240px, 60vw); height:3px; margin-top:2.4rem;}
  .landing-strip span{flex:1; border-radius:2px; opacity:.9;}
  .landing-stats{margin-top:1.1rem; font-size:.95rem; letter-spacing:.04em; color:var(--text-dim);}
  .landing-stats b{color:var(--text); font-weight:500;}
  .scroll-cue{position:absolute; left:6vw; bottom:2rem; display:flex; flex-direction:column; align-items:flex-start; gap:.6rem; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); opacity:.75; pointer-events:none;}
  .scroll-cue::after{content:""; width:1px; height:34px; background:linear-gradient(to bottom, var(--text-dim), transparent); transform-origin:top; animation:cue 2.4s ease-in-out infinite;}
  @keyframes cue{0%,100%{transform:scaleY(.4); opacity:.4;} 50%{transform:scaleY(1); opacity:1;}}
  @media (prefers-reduced-motion:reduce){.scroll-cue::after{animation:none;}}

  .rail{display:grid; grid-template-columns:repeat(auto-fill, 198px); gap:1.6rem; margin-top:3rem; padding-bottom:1rem; position:relative; z-index:2; align-items:start;}
  .empty-tier{font-family:'Lora', serif; font-style:italic; font-size:1.05rem; color:var(--tc); opacity:.8; margin-top:3rem; padding-top:1.6rem; border-top:1px solid rgba(255,255,255,.08); max-width:420px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
  .card{width:198px; position:relative; z-index:1;}
  .cover{width:198px; height:198px; border-radius:3px; background:linear-gradient(155deg, #181c24, #262b34); border:1px solid rgba(255,255,255,.08); overflow:hidden; position:relative; transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease, z-index .35s;}
  .cover:hover{transform:translateY(-6px); box-shadow:0 14px 34px -10px var(--cs), 0 0 0 1px var(--tc); border-color:var(--tc); z-index:5;}
  .cover img{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; object-position:center top; display:block;}
  .cover .placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:.9rem; text-align:center; font-family:'Fraunces', serif; font-size:1.05rem; font-weight:500; line-height:1.15; color:var(--text-dim);}

  .info{margin-top:.75rem;}
  .info .name{font-family:'Fraunces', serif; font-size:1.05rem; font-weight:500; line-height:1.2; color:var(--text); min-height:2.4em;}
  .meta{display:flex; justify-content:space-between; margin-top:.4rem; font-size:.82rem; color:var(--text-dim);}
  .meta .rating{color:var(--tc); font-weight:600;}
  .meta .star{color:#f3c969; margin-left:.15rem;}
  .meta .incomplete{color:var(--tc); opacity:.85;}

  /* ---------- Footer ---------- */
  .site-end{padding:5rem 6vw 4rem; display:flex; flex-direction:column; align-items:flex-start; gap:1.4rem; scroll-snap-align:end;}
  .end-line{font-family:'Lora', serif; font-style:italic; font-weight:500; font-size:clamp(1.05rem, 2vw, 1.4rem); color:var(--text-dim); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
  .end-link{font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); text-decoration:none; opacity:.85; transition:color .25s, opacity .25s;}
  .end-link span{display:inline-block; transition:transform .25s;}
  .end-link:hover{color:var(--text); opacity:1;}
  .end-link:hover span{transform:translateY(-3px);}


  /* ---------- Game Thoughts Modal Refined ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 15, 19, 0.8);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 6vw;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, backdrop-filter 0.35s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .modal-card {
    width: min(100%, 720px);
    background: var(--bg-raise);
    border: 1px solid var(--tc, rgba(255,255,255,0.1));
    border-radius: 6px;
    padding: 3rem 3rem 2.8rem 3rem;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7), 0 0 0 1px var(--tc, transparent);
    
    transform: scale(0.93) translateY(18px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  }
  .modal-overlay.active .modal-card {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  /* Staggered Content Cascade Animation */
  .modal-header-row, .modal-body {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  
  .modal-overlay.active .modal-header-row {
    opacity: 1;
    transform: translateY(0);
    transition-delay: 0.1s;
  }
  .modal-overlay.active .modal-body {
    opacity: 1;
    transform: translateY(0);
    transition-delay: 0.16s;
  }

  /* Header Row layout: Title/Meta left, Rating Badge right */
  .modal-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    position: relative;
    z-index: 2;
    margin-bottom: 1.5rem;
  }

  .modal-title-area {
    flex: 1;
  }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.5rem, 3.2vw, 2.1rem);
    font-weight: 500;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }

  .modal-meta {
    font-size: 0.88rem;
    color: var(--tc); /* Matches the tier's accent color */
    font-weight: 600; /* Makes it bolder */
    letter-spacing: 0.04em;
  }
  .modal-meta .progress-text {
    color: var(--tc);
    font-weight: 600;
  }

  /* Tall, thin rating badge matching modal background */
  .modal-rating-badge {
    background: var(--bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    padding: 0.6rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 60px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }
  
  .modal-rating-num {
    font-family: 'Fraunces', serif;
    font-size: 1.8rem;
    font-weight: 500;
    line-height: 1;
    color: var(--tc);
    letter-spacing: -0.03em;
  }

  .modal-rating-star {
    font-size: 0.75rem;
    color: #f3c969;
    margin-top: 0.25rem;
  }

  .modal-body {
    position: relative;
    z-index: 2;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    padding-top: 1.5rem;
    margin-top: 1rem;
  }
  
  .modal-thoughts {
    font-family: 'Work Sans', sans-serif;
    font-style: normal;
    font-size: 1.02rem;
    line-height: 1.7;
    color: var(--text);
    opacity: 0.92;
    -webkit-font-smoothing: antialiased;
  }
  
  .cover {
    cursor: pointer;
  }

  @media (max-width:640px){
    section.tier{min-height:98svh; padding:5rem 6vw 3rem; justify-content:flex-start;}
    section.landing{min-height:100svh; justify-content:center;}

    .ghost-num{
    top:10rem;
    right:4vw;
    transform:none;
    font-size:30vw;
    opacity: 0.1;
    }
    
    /* Hide that one line on empty tiers to prevent overlap with the ghost number */
    .empty-tier {
      border-top: none;
    }

    nav.dots{
    top:auto;
    right:auto;
    left:50%;
    bottom:calc(.9rem + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%);
    flex-direction:row;
    gap:.6rem;}
    
    html{scroll-snap-type:none;}
    section.tier{scroll-snap-align:none;}
    .site-end{scroll-snap-align:none;}

    .cover:hover{transform:none; box-shadow:none; border-color:rgba(255,255,255,.08);}

    /* ---------- Mobile Modal Layout Tweaks ---------- */
    .modal-card {
      padding: 0.9rem 1rem 0.8rem 1rem;
    }

    .modal-header-row {
      gap: 0.25rem;
      margin-bottom: 0;
    }

    .modal-body {
      padding-top: 0.5rem;
      margin-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    .modal-thoughts {
      font-size: 0.9rem;
      line-height: 1.2;
    }
  }

</style>
</head>
<body>

<nav class="dots" id="dots" aria-label="Tier navigation"></nav>
<main id="tiers"></main>

<footer class="site-end">
  <p class="end-line">Save point reached. The next game is on its way.</p>
  <a class="end-link" id="play-again" href="#home">Play again <span>↑</span></a>
</footer>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal-card" id="modalCard">
    
    <div class="modal-header-row">
      <div class="modal-title-area">
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-meta" id="modalMeta"></div>
      </div>
      <div class="modal-rating-badge" id="modalRatingBadge">
        <span class="modal-rating-num" id="modalRatingNum"></span>
        <span class="modal-rating-star">★</span>
      </div>
    </div>

    <div class="modal-body">
      <p class="modal-thoughts" id="modalThoughts"></p>
    </div>
    
  </div>
</div>

<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  document.documentElement.style.scrollSnapType = 'none';

const TIERS = [
  { num:10, color:'#f3c969', label:'Masterpiece', title:'Some games end. These changed me a little, and stayed.',
    games:[
      {name:'Elden Ring', rating:10, hours:300, cover:'covers/elden_ring.jpg',
        thoughts:"Elden Ring is my favorite game of all time. It was the first Souls game I ever played and it's the one that did everything perfectly. I loved its massive scale and its clever level design that provides an amazing exploration experience with zero handholding and a lot of hidden, but not tedious-to-find, dungeons and caves. The story is very convoluted to the point where you need a YouTube video to help you understand even the basics, but you don't need to understand the story to experience the great journey through the Lands Between. One thing that Elden Ring does great is that it removes all the tedious aspects of older Souls titles like the long runbacks to boss arenas by having more bonfires. That allows for more or tougher enemies to be placed in the area before the boss and also for the boss itself to be tougher and more aggressive, because every time you respawn you don't have to run through large groups of enemies to get to it again, saving time and health potions. Finally, the gameplay, although very challenging throughout the game, is perfectly fair because every enemy and boss attack in the game is dodgeable, meaning you can complete the game without taking a single hit if you learn the attacks well enough."},

      {name:'Nier Replicant ver.1.22474487139', rating:10, hours:45, cover:'covers/nier_replicant.jpg',
        thoughts:"NieR Replicant is my favorite story game alongside NieR:Automata. Its incredible story is slowly revealed with each playthrough, providing you with more information about backstories and details that you, as the protagonist, are unaware of in the beginning. By the time you complete the fifth and final playthrough, your perspective has shifted completely and you're contemplating everything. The director’s words, roughly, were: \"People do not need to be crazy or evil to commit atrocities—they just have to genuinely believe they are right\" which sums up the game’s philosophy well. All the characters are really well written and the music fits the mostly peaceful atmosphere well."},

      {name:"NieR: Automata Game of the YoRHa Edition", rating:10, hours:38, cover:"covers/nier_automata.jpg",
        thoughts:"NieR:Automata is my favorite story game alongside NieR Replicant. The story is amazing, and as in Replicant, you piece it together with every playthrough, experiencing different parts of the plot through the eyes of different characters. It also tackles deep philosophical themes such as existentialism and nihilism. Finally, the music is emotional and perfectly tailored to the story."},

      {name:'Red Dead Redemption II', rating:10, hours:140, cover:'covers/red_dead_2.jpg',
        thoughts:"Red Dead Redemption 2 is the greatest open-world story game I've ever played. It combines a massive map and incredibly detailed exploration with plenty of side quests, hidden treasures, and points of interest. The world feels alive and immerses you completely when exploring and especially during the long main story. It plays very smoothly and is well-crafted with so many mechanics and so much realism that it doesn't feel limiting or casual but rather detailed and satisfying. Its graphics are very realistic and refined, and you stop noticing the 30 FPS after a few hours. The voice acting is excellent and every character's personality really shines through."},
      
      {name:'Resident Evil 4', rating:10, hours:30, cover:'covers/re4.jpg',
        thoughts:"Resident Evil 4 has one of the longest and best stories in the franchise, with good pacing that keeps you invested throughout its 20 hours of action-heavy survival horror. The game looks beautiful with many unique sections, especially the castle area, and the puzzles are intuitive and well-placed. One of my favorite things about it is the companion mechanic: in certain areas, Ashley or Luis accompanies and assists you in puzzle-solving and fighting the enemies you encounter. Finally, the characters' personalities and voice acting are superb."},

      {name:'Resident Evil Requiem', rating:10, hours:24, cover:'covers/re9.jpg',
        thoughts:"Resident Evil Requiem balances a truly horrifying atmosphere and action-packed sequences between its two protagonists, giving us the best of both worlds, unlike other Resident Evil games that do both at the same time with half the intensity. Its story is excellent, tracing back to almost the beginning of the franchise and delivering deep and consistent lore across multiple games. Most of its beauty comes from the top-notch graphics in its cutscenes and environment. The final piece of the puzzle that makes this game an incredible experience is the perfect voice acting that beautifully captures the characters' emotions."}
    ] },

  { num:9, color:'#e8935a', label:'Outstanding', title:'Games that left a warm glow long after I put the controller down.',
    games:[
      {name:'Disco Elysium', rating:9, hours:30,cover:'covers/disco_elysium.jpg',
        thoughts:"Disco Elysium features a great, detailed story in which you have to solve a murder case and by doing so you uncover the truth about the events. Playing this game feels like reading a book because in order to uncover clues, you have to talk to people to find out what they know and pass certain skill checks to push them for more information, which makes for a unique gameplay experience. It also offers a fair amount of replayability which is due to its skill-point system. This allows you to be good at different aspects of yourself, like your intelligence, and thus leaves room for additional playthroughs where you can instead focus on strength and end up seeing the story unfold slightly differently. The music is good and it fits the mysterious atmosphere well. Finally, all the characters have their own unique personalities, and the voice acting is amazing."}
    ] },

  { num:8, color:'#d9735a', label:'Excellent', title:'Beautifully made, and I enjoyed every step of the way.',
    games:[ 
      {name:'Dark Souls III', rating:8, hours:95, cover:'covers/ds3.jpg',
        thoughts:"Dark Souls 3 is perfect if you want the closest you can get to Elden Ring. Visually, the game is decent but it more than makes up for it with its solid gameplay that retains the original Souls recipe, but with vastly improved enemy, boss, and level design compared to earlier Souls titles."},

      {name:'Sekiro', rating:8, hours:75, cover:'covers/sekiro.jpg',
        thoughts:"Sekiro has the greatest swordplay I have ever experienced in a video game. The combat is very fast-paced and requires you to make split-second decisions to parry your opponent's attacks and then hit back before they can recover. Its katanas and world design are the icing on the cake because I am very fond of Japanese culture."},

      {name:'Bloodborne', rating:8, hours:90, cover:'covers/bloodborne.jpg',
        thoughts:"Bloodborne's grotesque atmosphere sets it apart from other Souls games. Its gameplay mechanics such as rallying and parrying with a gun, instead of the usual sword, make for a unique experience. Every boss fight is elevated by the amazing classical-style soundtrack it features."},

      {name:'Death Stranding', rating:8, hours:60, cover:'covers/death_stranding.jpg',
        thoughts:"Death Stranding immediately draws you into its world with its long cutscenes and initial world-building. Its story is very complicated with a lot of information to learn, leaving you with many questions throughout your playthrough and very likely after finishing it too. Walking around the map is simple, but it feels meaningful because you have to avoid obstacles and enemies and cross harsh terrain. One of the biggest highlights of the game is the photorealistic cutscenes that are long and frequent, essentially serving as a reward for your difficult travels. My only complaint is that the game could have used slightly harsher terrain or more frequent opportunities for overcoming obstacles and other non-enemy hazards."},

      {name:'Hitman: World of Assassination', rating:8, hours:350, cover:'covers/hitman_woa.jpg',
        thoughts:"The Hitman: World of Assassination trilogy holds a special place in my heart due to its stealth concept of an assassin taking out high-profile targets without leaving a trace. Its strongest aspect is the amount of content, with 20 detailed maps ranging from small to huge in scale, as well as many more maps and missions separate from the main campaign in DLCs or side missions. On top of that, every map has multiple ways to kill your targets or complete other challenges, which maximizes replayability. Finally, the realistic NPC and enemy behavior provides a fair challenge that keeps you entertained, requiring you to use different strategies every time you play."},

      {name:'Rainbow Six Siege', rating:8, hours:418, cover:'covers/r6.jpg',
        thoughts:"Rainbow Six Siege is the most strategic FPS there is because knowing the game well and using your gadgets correctly can give you the advantage over opponents with better aim. Featuring dozens of operators, each with their own unique gadget, the game allows for countless strategies and creative opportunities."}
     ] },

  { num:7, color:'#5fa8c9', label:'Very Good', title:'A genuinely satisfying experience, just a few rough edges short of greatness.',
    games:[
      {name:'Alien Isolation', rating:7, hours:25, cover:'covers/alien_isolation.jpg',
        thoughts:"Alien Isolation is one of the scariest experiences I've had in a horror game. Its stressful atmosphere keeps you tense, constantly scanning for movement and sounds that might indicate enemy presence. The xenomorph is a great antagonist, forcing you to take your time and play carefully because if it hears you, there's no running from it. Its environment is well-designed, and the gameplay is clean although it tends to get a little repetitive after a while. Unfortunately, the way I would describe this game is that it is a 15-hour game stretched to around 25 hours. There are a lot of simple fetch missions and many sneaking-from-androids sections that serve as padding for the game's duration."},

      {name:'GTA V<br>(story mode)', rating:7, hours:35, cover:'covers/gta5.jpg',
        thoughts:"GTA V features a great, long story, good graphics, and excellent dialogue and voice acting that give depth to every character. Its large map and many side missions support the main story well and provide extra hours of content. Finally, the driving is fun, and the overall gameplay is very smooth."},

      {name:'Ghost Recon Wildlands', rating:7, hours:55, cover:'covers/gr_wildlands.jpg',
        thoughts:"Ghost Recon Wildlands belongs to the Ghost Recon franchise, which I adore because of its concept and execution. Wildlands combines open-world freedom (you can take on main and side missions whenever you want) with stealthy clearing of enemy bases. Its story builds up well as you play, providing backstories for the cartel bosses before you fight them. Gradually wiping out enemies and area bosses until you clear the whole map and eliminate the leader makes it feel like your actions matter in taking down the cartel and they're not just part of a checklist. The only thing that let me down is the enemy AI that can sometimes spot you much more easily than it should and raise the alarm instantaneously. "},

      {name:'Ghost Recon Breakpoint', rating:7, hours:100, cover:'covers/gr_breakpoint.jpg',
        thoughts:"Ghost Recon Breakpoint belongs to the Ghost Recon franchise, which I adore because of its concept and execution. Breakpoint follows in Wildlands' footsteps by keeping the great open-world design and giving you the same freedom to plan and execute your missions. A big improvement is that the AI behavior is more realistic, so enemies don't sound the alarm as soon as they catch a glimpse of you. Unfortunately, the same cannot be said of its story. Fighting generic high-tech soldiers and drones doesn’t feel as meaningful as fighting cartel members and their leaders while learning about their crimes from documents you find."},

      {name:'Heavy Rain', rating:7, hours:9, cover:'covers/heavy_rain.jpg',
        thoughts:"Heavy Rain has a solid story that keeps you invested until the end. The characters are interesting and the plot twist when you uncover the killer gives the ending a nice touch. Playing it can feel a little stale because your only real gameplay is manually opening doors and drawers, and performing quick-time events. Although it's close, it's not something that feels like a pure AAA experience."}
    ] },

  { num:6, color:'#5fb3b0', label:'Good', title:'A step above mediocre, with enough going for it to stand out a little.',
    games:[
      {name:'Ghost of Tsushima', rating:6, hours:46, cover:'covers/ghost_of_tsushima.jpg',
        thoughts:"Ghost of Tsushima didn't immerse me that much in its story, but most of the game looked beautiful. One thing that I have never seen before in a game is the intuitive guidance system: with a swipe of the touchpad, the wind blows showing you the direction you need to travel. Its large map gives you the freedom to explore and attack enemy bases that you find, but after a while it can get a little boring, especially the other activities like using hot springs and finding fox dens. Overall, the gameplay is smooth, closely resembling Sekiro but with more moves, abilities and perks that give the combat a more Western feel than the Souls games."},

      {name:'Resident Evil 2', rating:6, hours:15, cover:'covers/re2.jpg',

      {name:'Sniper Elite 4<br>(custom difficulty only)', rating:6, hours:28, cover:'covers/sniper_elite_4.jpg',
        thoughts:"Sniper Elite 4 is one of the few sniping games out there that are worth your time but only under specific conditions. On its default settings, the game is unplayable because of the terribly unrealistic bullet physics that completely ruin the shooting experience in a game made for exactly that. Thankfully, using the custom settings to disable some of the physics, such as the wind, helps reach a much more realistic level of ballistics, which then makes the game fun. My favorite part of this game is the concept I like to call \"loud sniping\". Unlike in Ghost Recon, where you use a suppressor to avoid alerting the enemies that you're there, in Sniper Elite the enemies, for the most part, are aware of your presence but unable to pinpoint your location because you're constantly repositioning and masking the sound of your shots. Its beautiful, big maps help a lot by providing you with plenty of room you can use to eliminate your targets. Finally, the story is underwhelming with decent-at-best voice acting."},

      {name:'Mass Effect 2', rating:6, hours:30, cover:'covers/mass_effect2.png',

      {name:'Silent Hill 2 (2001)', rating:6, hours:8, cover:'covers/sh2_original.jpg',

function cubicBezier(x1, y1, x2, y2){
  function P(t, a, b){ const it = 1 - t; return 3*it*it*t*a + 3*it*t*t*b + t*t*t; }
  return function(t){
    let lo = 0, hi = 1, mid;
    for (let i = 0; i < 20; i++){
      mid = (lo + hi) / 2;
      if (P(mid, x1, x2) < t) lo = mid; else hi = mid;
    }
    return P(mid, y1, y2);
  };
}
const scrollEase = cubicBezier(0.25, 0.1, 0.25, 1);

function hexToRgba(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

let scrollAnimId = 0;
function smoothTo(el){
  scrollAnimId++;
  const myId = scrollAnimId;
  document.documentElement.style.scrollSnapType = 'none';
  const startY = window.scrollY;
  const targetY = el.getBoundingClientRect().top + window.scrollY;
  const duration = 1100;
  const startTime = performance.now();
  function step(now){
    if (myId !== scrollAnimId) return;
    const progress = Math.min((now - startTime) / duration, 1);
    window.scrollTo(0, startY + (targetY - startY) * scrollEase(progress));
    if (progress < 1) requestAnimationFrame(step);
    else document.documentElement.style.scrollSnapType = "";
  }
  requestAnimationFrame(step);
}

const tiersEl = document.getElementById('tiers');
const dotsEl = document.getElementById('dots');

/* ---------- Landing section ---------- */
const totalGames = TIERS.reduce((n, t) => n + t.games.length, 0);
const totalHours = TIERS.reduce((n, t) => n + t.games.reduce((h, g) => h + (g.hours || 0), 0), 0);

const landing = document.createElement('section');
landing.className = 'tier landing';
landing.id = 'home';
landing.style.setProperty('--tc', '#f3c969');
landing.innerHTML = `
  <div class="landing-head">
    <h1 class="landing-phrase">Games are art.</h1>
    <p class="landing-sub">Worlds I've lived in, and what they left me with.</p>
    <div class="landing-strip" aria-hidden="true">${TIERS.map(t => `<span style="background:${t.color}"></span>`).join("")}</div>
    <p class="landing-stats"><b>${totalGames.toLocaleString('en-US')}</b> ${totalGames === 1 ? 'game' : 'games'} · <b>${totalHours.toLocaleString('en-US')}</b> ${totalHours === 1 ? 'hour' : 'hours'}</p>
  </div>
  <div class="scroll-cue" aria-hidden="true">Scroll</div>`;
tiersEl.appendChild(landing);

const homeDot = document.createElement('button');
homeDot.dataset.t = 'home';
homeDot.title = 'Home';
homeDot.textContent = 'H';
homeDot.classList.add('active');
homeDot.onclick = () => smoothTo(landing);
dotsEl.appendChild(homeDot);

/* ---------- Tiers ---------- */
TIERS.forEach((t) => {
  const section = document.createElement('section');
  section.className = 'tier';
  section.id = 't'+t.num;
  section.style.setProperty('--tc', t.color);
  section.style.setProperty('--cs', hexToRgba(t.color, .3));

  const cards = t.games.map((g, idx) => `
    <div class="card">
      <div class="cover" data-tier="${t.num}" data-index="${idx}" tabindex="0" role="button" aria-label="View thoughts for ${g.name}">
        ${g.cover ? `<img src="${g.cover}" alt="${g.name} cover">` : `<div class="placeholder">${g.name}</div>`}
      </div>
      <div class="info">
        <div class="name">${g.name}</div>
        <div class="meta">
          <span class="rating">${g.rating}<span class="star">★</span></span>
          <span>${g.progress != null && g.progress < 100 ? `<span class="incomplete">${g.progress}%</span> · ` : ""}${g.hours != null ? g.hours + ' hrs' : '— hrs'}</span>
        </div>
      </div>
    </div>`).join("");

  const body = t.games.length ? `<div class="rail">${cards}</div>` : `<p class="empty-tier">Nothing here — yet.</p>`;

  section.innerHTML = `
    <div class="ghost-num tier-display">${t.num}</div>
    <div class="tier-head">
      <div class="tier-num tier-display">${t.label}</div>
      <div class="tier-title">${t.title}</div>
    </div>
    ${body}`;
  tiersEl.appendChild(section);

  const dot = document.createElement('button');
  dot.dataset.t = section.id;
  dot.title = t.num;
  dot.textContent = t.num;
  dot.onclick = () => smoothTo(section);
  dotsEl.appendChild(dot);
});

const dots = [...dotsEl.children];
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      dots.forEach(d=>d.classList.remove('active'));
      dotsEl.querySelector(`button[data-t="${e.target.id}"]`).classList.add('active');
    }
  });
}, {rootMargin:'-50% 0px -50% 0px', threshold:0});
[...tiersEl.children].forEach(s=>io.observe(s));

/* ---------- Footer: Play again ---------- */
document.getElementById('play-again').addEventListener('click', e => { e.preventDefault(); smoothTo(landing); });

/* ---------- Modal Logic ---------- */
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalMeta = document.getElementById('modalMeta');
const modalThoughts = document.getElementById('modalThoughts');
const modalCard = document.getElementById('modalCard');
const modalRatingNum = document.getElementById('modalRatingNum');

function openModal(game, tierColor) {
  modalCard.style.setProperty('--tc', tierColor);
  modalTitle.innerHTML = game.name;
  
  modalRatingNum.textContent = game.rating;
  
  const hoursText = game.hours != null ? `${game.hours} hours` : '— hours';
  const progressText = game.progress != null && game.progress < 100 ? ` · <span class="progress-text">${game.progress}% completed</span>` : "";
  
  modalMeta.innerHTML = `${hoursText}${progressText}`;
  
  modalThoughts.textContent = game.thoughts || "No thoughts logged for this game yet.";
  
  modalOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOverlay.classList.remove('active');
  document.body.style.overflow = "";
}

// Close via clicking background overlay or pressing Escape
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
});

// Helper function to handle opening the modal from a card
function handleCardInteraction(e) {
  const cover = e.target.closest('.cover');
  if (!cover) return;
  
  const tierNum = cover.dataset.tier;
  const gameIdx = cover.dataset.index;
  const tierObj = TIERS.find(t => t.num == tierNum);
  if (tierObj && tierObj.games[gameIdx]) {
    openModal(tierObj.games[gameIdx], tierObj.color);
  }
}

// Listen for clicks on #tiers
document.getElementById('tiers').addEventListener('click', handleCardInteraction);

// Listen for keyboard interaction (Enter or Space) on #tiers
document.getElementById('tiers').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    handleCardInteraction(e);
  }
});

function resetScroll(){
  window.scrollTo(0, 0);
  document.documentElement.style.scrollSnapType = "";
}

requestAnimationFrame(resetScroll);
window.addEventListener('load', resetScroll);
window.addEventListener('pageshow', e => { if (e.persisted) resetScroll(); });
</script>
</body>
</html>
